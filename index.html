<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Configuración - Bot Leaderboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>

    <style>
        .tab-activa {
            border-bottom: 4px solid #3b82f6;
            color: #1d4ed8;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-6xl mx-auto bg-white rounded-lg shadow-lg overflow-hidden">
        
        <div class="flex justify-between items-center bg-gray-800 text-white p-6">
            <h1 class="text-2xl font-bold">Combat Variable Manager</h1>
            <button id="btn-guardar" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded transition-colors shadow-md">
                💾 Save Settings in Bot
            </button>
        </div>

        <div class="border-b border-gray-200 bg-gray-50 flex overflow-x-auto whitespace-nowrap">
            <button class="tab-btn tab-activa px-4 py-4 hover:bg-gray-200 transition" onclick="cambiarPestaña(1, this)">Attack/Win/Focus</button>
            <button class="tab-btn px-4 py-4 hover:bg-gray-200 transition" onclick="cambiarPestaña(2, this)">Attack/Win/NoFocus</button>
            <button class="tab-btn px-4 py-4 hover:bg-gray-200 transition" onclick="cambiarPestaña(3, this)">Attack/Lose/Focus</button>
            <button class="tab-btn px-4 py-4 hover:bg-gray-200 transition" onclick="cambiarPestaña(4, this)">Attack/Lose/NoFocus</button>
            <button class="tab-btn px-4 py-4 hover:bg-gray-200 transition" onclick="cambiarPestaña(5, this)">Defense/Win/Focus</button>
            <button class="tab-btn px-4 py-4 hover:bg-gray-200 transition" onclick="cambiarPestaña(6, this)">Defense/Win/NoFocus</button>
            <button class="tab-btn px-4 py-4 hover:bg-gray-200 transition" onclick="cambiarPestaña(7, this)">Defense/Lose/Focus</button>
            <button class="tab-btn px-4 py-4 hover:bg-gray-200 transition" onclick="cambiarPestaña(8, this)">Defense/Lose/NoFocus</button>
            <button class="tab-btn px-6 py-4 hover:bg-gray-200 transition text-purple-700 font-bold" onclick="cambiarPestaña(9, this)">⭐ Combat types</button>
        </div>

        <div class="p-6">
            <h2 id="titulo-tabla" class="text-xl font-semibold mb-4 text-gray-700">Editing: Attack + Win + Focus</h2>
            <div id="mi-tabla-excel" class="w-full"></div>
        </div>
    </div>

    <script type="module">
        // --- 1. MEMORIA DE DATOS ---
        const datosTablas = {};

        function generarMatrizBase() {
            return [
                { id: "a1", aliados: "1 Allies", e1: 0, e2: 0, e3: 0, e4: 0, e5: 0, e6: 0 },
                { id: "a2", aliados: "2 Allies", e1: 0, e2: 0, e3: 0, e4: 0, e5: 0, e6: 0 },
                { id: "a3", aliados: "3 Allies", e1: 0, e2: 0, e3: 0, e4: 0, e5: 0, e6: 0 },
                { id: "a4", aliados: "4 Allies", e1: 0, e2: 0, e3: 0, e4: 0, e5: 0, e6: 0 },
                { id: "a5", aliados: "5 Allies", e1: 0, e2: 0, e3: 0, e4: 0, e5: 0, e6: 0 }
            ];
        }

        for (let i = 1; i <= 8; i++) { datosTablas[i] = generarMatrizBase(); }

        datosTablas[9] = [
            { id: "c1", condicion: "Attack/Win/Focus", prism: 0, perco: 0, ava: 0 },
            { id: "c2", condicion: "Attack/Win/NoFocus", prism: 0, perco: 0, ava: 0 },
            { id: "c3", condicion: "Attack/Lose/Focus", prism: 0, perco: 0, ava: 0 },
            { id: "c4", condicion: "Attack/Lose/NoFocus", prism: 0, perco: 0, ava: 0 },
            { id: "c5", condicion: "Defense/Win/Focus", prism: 0, perco: 0, ava: 0 },
            { id: "c6", condicion: "Defense/Win/NoFocus", prism: 0, perco: 0, ava: 0 },
            { id: "c7", condicion: "Defense/Lose/Focus", prism: 0, perco: 0, ava: 0 },
            { id: "c8", condicion: "Defense/Lose/NoFocus", prism: 0, perco: 0, ava: 0 }
        ];

        let tablaActiva = null;
        let pestañaActual = 1;

        // --- 2. COLUMNAS VISUALES ---
        const columnasBase = [
            { title: "Allies ↓ / Enemies →", field: "aliados", width: 180, cssClass: "bg-gray-200 font-bold", headerSort: false },
            crearColumnaNumero("0 Enemies", "e1"),
            crearColumnaNumero("1 Enemies", "e2"),
            crearColumnaNumero("2 Enemies", "e3"),
            crearColumnaNumero("3 Enemies", "e4"),
            crearColumnaNumero("4 Enemies", "e5"),
            crearColumnaNumero("5 Enemies", "e6"),
        ];

        const columnasEspeciales = [
            { title: "Battle Condition", field: "condicion", width: 200, cssClass: "bg-gray-200 font-bold", headerSort: false },
            crearColumnaNumero("Prism", "prism"),
            crearColumnaNumero("Perco", "perco"),
            crearColumnaNumero("AvA", "ava")
        ];

        // --- 3. DIBUJAR TABLA ---
        function dibujarTabla(numeroPestaña) {
            if (tablaActiva) {
                datosTablas[pestañaActual] = tablaActiva.getData();
                tablaActiva.destroy(); 
            }
            let columnasUsar = (numeroPestaña === 9) ? columnasEspeciales : columnasBase;
            tablaActiva = new Tabulator("#mi-tabla-excel", {
                data: datosTablas[numeroPestaña],
                layout: "fitColumns",
                columns: columnasUsar,
            });
            pestañaActual = numeroPestaña;
        }

        function crearColumnaNumero(titulo, campo) {
            return {
                title: titulo,
                field: campo,
                editor: "number",
                editorParams: {
                    step: "any",
                    elementAttributes: {
                        name: "cell-editor"
                    }
                },
                formatter: (cell) => {
                    let value = cell.getValue();
                    if (value === undefined || value === null) return "0";
                    return (value % 1 === 0) ? Math.floor(value) : value;
                },
                hozAlign: "center"
            };
        }

        async function cargarDatosDesdeBot() {
            try {
                const respuesta = await fetch('https://botdiscord-production-e701.up.railway.app/api/obtener-tablas', {
                    method: 'GET',
                    headers: { 'Authorization': 'UnTokenSecreto123' }
                });

                if (respuesta.ok) {
                    const datos = await respuesta.json();
                    
                    // 1. Rellenar tablas base (1-8)
                    const sufijos = {
                        1: "ataque_victoria_focus", 2: "ataque_victoria_nofocus",
                        3: "ataque_derrota_focus", 4: "ataque_derrota_nofocus",
                        5: "defensa_victoria_focus", 6: "defensa_victoria_nofocus",
                        7: "defensa_derrota_focus", 8: "defensa_derrota_nofocus"
                    };

                    for (let i = 1; i <= 8; i++) {
                        datosTablas[i].forEach(fila => {
                            for (let e = 1; e <= 6; e++) {
                                let llave = `base_${sufijos[i]}_${fila.id}_e${e}`;
                                if (datos[llave] !== undefined) fila[`e${e}`] = Number(datos[llave]);
                            }
                        });
                    }

                    // 2. Rellenar tabla especial (9)
                    const conds = Object.values(sufijos);
                    datosTablas[9].forEach((fila, index) => {
                        let c = conds[index];
                        if (datos[`extra_prism_${c}`] !== undefined) fila.prism = datos[`extra_prism_${c}`];
                        if (datos[`extra_perco_${c}`] !== undefined) fila.perco = datos[`extra_perco_${c}`];
                        if (datos[`extra_ava_${c}`] !== undefined) fila.ava = datos[`extra_ava_${c}`];
                    });

                    dibujarTabla(1);
                }
            } catch (e) { 
                console.error("No se pudieron cargar los datos, cargando valores por defecto:", e);
                dibujarTabla(1);            
            }
        }

        // --- 4. CAMBIAR PESTAÑA ---
        const nombresPestañas = {
            1: "Attack + Win + Focus", 2: "Attack + Win + No Focus",
            3: "Attack + Defeat + Focus", 4: "Attack + Defeat + No Focus",
            5: "Defense + Win + Focus", 6: "Defense + Win + No Focus",
            7: "Defense + Defeat + Focus", 8: "Defense + Defeat + No Focus",
            9: "Extra Values: Prism, Perco & AvA"
        };

        window.cambiarPestaña = function(numero, elemento) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('tab-activa'));
            elemento.classList.add('tab-activa');
            document.getElementById('titulo-tabla').innerText = "Editing: " + nombresPestañas[numero];
            dibujarTabla(numero);
        };

        window.onload = function() { cargarDatosDesdeBot(); };

        // --- 5. ENVIAR AL BOT (BACKEND) ---
        document.getElementById('btn-guardar').addEventListener('click', async function() {
            if (tablaActiva) { datosTablas[pestañaActual] = tablaActiva.getData(); }
            
            const JSON_ParaElBot = {};
            const sufijosCondicion = {
                1: "ataque_victoria_focus", 2: "ataque_victoria_nofocus",
                3: "ataque_derrota_focus", 4: "ataque_derrota_nofocus",
                5: "defensa_victoria_focus", 6: "defensa_victoria_nofocus",
                7: "defensa_derrota_focus", 8: "defensa_derrota_nofocus"
            };

            for (let i = 1; i <= 8; i++) {
                const condicion = sufijosCondicion[i];
                datosTablas[i].forEach(fila => {
                    for (let e = 1; e <= 6; e++) {
                        JSON_ParaElBot[`base_${condicion}_${fila.id}_e${e}`] = parseFloat(fila[`e${e}`]) || 0;
                    }
                });
            }

            const llavesCondicionOrdenadas = Object.values(sufijosCondicion); 
            datosTablas[9].forEach((fila, index) => {
                let condicion = llavesCondicionOrdenadas[index];
                JSON_ParaElBot[`extra_prism_${condicion}`] = parseFloat(fila.prism) || 0;
                JSON_ParaElBot[`extra_perco_${condicion}`] = parseFloat(fila.perco) || 0;
                JSON_ParaElBot[`extra_ava_${condicion}`] = parseFloat(fila.ava) || 0;
            });

            console.log("Datos listos para enviar:", JSON_ParaElBot); // Para que lo veas en consola (F12)
            const btn = document.getElementById('btn-guardar');
            btn.innerText = "⏳ Saving...";

            try {
                // AQUÍ: Reemplaza con la IP real cuando el backend esté listo
                const respuesta = await fetch('https://botdiscord-production-e701.up.railway.app/api/guardar-tablas', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'UnTokenSecreto123'
                    },
                    body: JSON.stringify(JSON_ParaElBot)
                });

                if (respuesta.ok) { alert("✅ ¡The 264 variables were updated in the bot!"); } 
                else { alert("❌ Error communicating with the bot."); }
            } catch (error) {
                console.error(error);
                alert("❌ No se pudo conectar con el servidor (Asegúrate de cambiar IP_DE_TU_BOT en el código).");
            } finally {
                btn.innerText = "💾 Save Settings in Bot";
            }
        });
    </script>
</body>
</html>
